name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate source
        run: npm run check
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Test Chrome
        run: npm test
      - name: Test Edge
        run: npm run test:edge
      - name: Build ZIP and checksum
        run: npm run build
      - name: Read validated package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid extension version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afloat-package
          path: |
            dist/afloat-${{ steps.version.outputs.value }}.zip
            dist/afloat-${{ steps.version.outputs.value }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: afloat-package
          path: dist
      - name: Commit the verified package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit reached main; its build will publish the package."
            exit 0
          fi
          (cd dist && sha256sum --check "afloat-$PACKAGE_VERSION.zip.sha256")
          git add --force -- "dist/afloat-$PACKAGE_VERSION.zip" "dist/afloat-$PACKAGE_VERSION.zip.sha256"
          if git diff --cached --quiet; then
            echo "The package is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Afloat $PACKAGE_VERSION package"
          git push origin HEAD:main
