name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: pnpm run check
      - name: Test Chrome
        run: pnpm test
      - name: Test Edge
        run: pnpm run test:edge
      - name: Build ZIP and checksum
        run: pnpm run build
      - name: Read validated package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid extension version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afloat-package
          path: |
            dist/afloat-${{ steps.version.outputs.value }}.zip
            dist/afloat-${{ steps.version.outputs.value }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
